<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="40%" stop-color="#0a1426"/>
      <stop offset="70%" stop-color="#0e1d38"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <radialGradient id="koreaGlow" cx="20%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="japanGlow" cx="80%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="blueStream" x1="0%" y1="100%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="goldStream" x1="100%" y1="100%" x2="20%" y2="20%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="goldEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#080e1a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="highGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="26" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Panoramic Canvas -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" fill="url(#koreaGlow)"/>
  <rect width="1200" height="480" fill="url(#japanGlow)"/>

  <!-- Subtle Perspective Grid / Horizon -->
  <g opacity="0.16" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="380" x2="1200" y2="380"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="425" x2="1200" y2="425"/>
    <line x1="0" y1="455" x2="1200" y2="455"/>
    <line x1="600" y1="370" x2="0" y2="480"/>
    <line x1="600" y1="370" x2="200" y2="480"/>
    <line x1="600" y1="370" x2="400" y2="480"/>
    <line x1="600" y1="370" x2="600" y2="480"/>
    <line x1="600" y1="370" x2="800" y2="480"/>
    <line x1="600" y1="370" x2="1000" y2="480"/>
    <line x1="600" y1="370" x2="1200" y2="480"/>
  </g>

  <!-- Yokohama Kannai Skyline Silhouette (Waterfront) -->
  <g opacity="0.4" fill="url(#skylineGrad)">
    <path d="M0 380 Q200 365 450 375 Q750 360 1050 378 L1200 380 L1200 480 L0 480 Z"/>
    
    <!-- Landmark Tower Silhouette & High-rises (Left-Center) -->
    <rect x="220" y="275" width="44" height="105" rx="3"/>
    <polygon points="220,275 242,225 264,275"/>
    <rect x="272" y="305" width="36" height="75" rx="2"/>
    <rect x="315" y="325" width="50" height="55" rx="2"/>
    <rect x="175" y="330" width="38" height="50" rx="2"/>
    <rect x="130" y="340" width="40" height="40" rx="2"/>

    <!-- Ferris Wheel Silhouette (Cosmo Clock 21) -->
    <circle cx="385" cy="335" r="26" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.35"/>
    <line x1="385" y1="335" x2="385" y2="380" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>

    <!-- Yokohama Bay Bridge (Right Side) -->
    <polygon points="860,380 864,260 870,260 874,380"/>
    <polygon points="975,380 979,260 985,260 989,380"/>
    <rect x="800" y="335" width="250" height="6" rx="2"/>
    <line x1="867" y1="265" x2="800" y2="335" stroke="#f59e0b" stroke-width="0.8" opacity="0.45"/>
    <line x1="867" y1="265" x2="922" y2="335" stroke="#f59e0b" stroke-width="0.8" opacity="0.45"/>
    <line x1="982" y1="265" x2="922" y2="335" stroke="#f59e0b" stroke-width="0.8" opacity="0.45"/>
    <line x1="982" y1="265" x2="1050" y2="335" stroke="#f59e0b" stroke-width="0.8" opacity="0.45"/>
  </g>

  <!-- Water Surface Reflections -->
  <rect x="0" y="380" width="1200" height="100" fill="#050a14" opacity="0.75"/>
  <ellipse cx="600" cy="400" rx="520" ry="10" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="425" rx="380" ry="7" fill="#fbbf24" opacity="0.1" filter="url(#softGlow)"/>

  <!-- Neural Synapse Network / Mental Coaching Graph -->
  <g stroke="#93c5fd" stroke-width="1" opacity="0.28" filter="url(#softGlow)">
    <line x1="120" y1="130" x2="240" y2="90"/>
    <line x1="240" y1="90" x2="360" y2="150"/>
    <line x1="360" y1="150" x2="480" y2="100"/>
    <line x1="480" y1="100" x2="600" y2="160"/>
    
    <line x1="1080" y1="120" x2="960" y2="80"/>
    <line x1="960" y1="80" x2="840" y2="140"/>
    <line x1="840" y1="140" x2="720" y2="100"/>
    <line x1="720" y1="100" x2="600" y2="160"/>

    <line x1="240" y1="90" x2="200" y2="190"/>
    <line x1="360" y1="150" x2="320" y2="230"/>
    <line x1="960" y1="80" x2="1000" y2="180"/>
    <line x1="840" y1="140" x2="880" y2="220"/>
  </g>

  <!-- Glowing Nodes of the Neural Network -->
  <g fill="#60a5fa" filter="url(#softGlow)">
    <circle cx="120" cy="130" r="3.5"/>
    <circle cx="240" cy="90" r="4.5" fill="#38bdf8"/>
    <circle cx="360" cy="150" r="5" fill="#93c5fd"/>
    <circle cx="480" cy="100" r="4.5" fill="#60a5fa"/>
    <circle cx="200" cy="190" r="3"/>
    <circle cx="320" cy="230" r="3.5"/>
  </g>
  <g fill="#fbbf24" filter="url(#softGlow)">
    <circle cx="1080" cy="120" r="3.5"/>
    <circle cx="960" cy="80" r="4.5" fill="#fde047"/>
    <circle cx="840" cy="140" r="5" fill="#f59e0b"/>
    <circle cx="720" cy="100" r="4.5" fill="#fbbf24"/>
    <circle cx="1000" cy="180" r="3"/>
    <circle cx="880" cy="220" r="3.5"/>
  </g>

  <!-- Dual Energy Streams / Convergence Ribbons -->
  <!-- Korea Stream (Cobalt Blue -> Cyan) -->
  <path d="M-60 440 C 180 410, 250 270, 450 240 C 530 225, 570 215, 600 205" 
        fill="none" stroke="url(#blueStream)" stroke-width="16" stroke-linecap="round" opacity="0.88" filter="url(#highGlow)"/>
  <path d="M-60 440 C 180 410, 250 270, 450 240 C 530 225, 570 215, 600 205" 
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M-20 460 C 220 420, 310 310, 480 270 C 550 250, 580 230, 600 220" 
        fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Japan Stream (Amber Gold -> Yellow) -->
  <path d="M1260 440 C 1020 410, 950 270, 750 240 C 670 225, 630 215, 600 205" 
        fill="none" stroke="url(#goldStream)" stroke-width="16" stroke-linecap="round" opacity="0.88" filter="url(#highGlow)"/>
  <path d="M1260 440 C 1020 410, 950 270, 750 240 C 670 225, 630 215, 600 205" 
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M1220 460 C 980 420, 890 310, 720 270 C 650 250, 620 230, 600 220" 
        fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Center Convergence Core -->
  <circle cx="600" cy="205" r="140" fill="url(#coreGlow)"/>
  <ellipse cx="600" cy="205" rx="80" ry="20" fill="#ffffff" opacity="0.8" filter="url(#highGlow)"/>
  
  <!-- Four-Point Stellar Flare -->
  <g transform="translate(600, 205)" filter="url(#highGlow)">
    <polygon points="0,-90 4,-15 75,0 4,15 0,90 -4,15 -75,0 -4,-15" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-50 2,-8 40,0 2,8 0,50 -2,8 -40,0 -2,-8" fill="#fde047" opacity="0.85"/>
  </g>

  <!-- 10th Anniversary Center Emblem -->
  <g transform="translate(600, 205)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldEmblem)" stroke-width="1.8" opacity="0.5" stroke-dasharray="5,3"/>
    <circle cx="0" cy="0" r="84" fill="#070d1a" stroke="url(#goldEmblem)" stroke-width="2.5" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="77" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

    <!-- Dual Flag Accent Dots -->
    <g transform="translate(0, -55)">
      <circle cx="-13" cy="0" r="5" fill="#2563eb" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
      <circle cx="13" cy="0" r="5" fill="#e11d48" filter="url(#softGlow)"/>
    </g>

    <!-- Number "10" -->
    <text x="0" y="-5" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="44" fill="url(#goldEmblem)" letter-spacing="1">
      10<tspan font-size="22" font-weight="800" dy="-17">th</tspan>
    </text>

    <!-- Subtitle: ANNIVERSARY -->
    <text x="0" y="21" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="800" font-size="9.5" fill="#fef08a" letter-spacing="3.5">
      ANNIVERSARY
    </text>

    <!-- Partnership: MCCI & FIELD FLOW -->
    <text x="0" y="38" text-anchor="middle" font-family="'Pretendard', 'Inter', sans-serif" font-weight="700" font-size="8" fill="#94a3b8" letter-spacing="1.2">
      MCCI × FIELD FLOW
    </text>

    <!-- Milestone Era: 2016 – 2026 -->
    <rect x="-32" y="47" width="64" height="14" rx="7" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="0.7"/>
    <text x="0" y="57" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="7.5" fill="#fbbf24" letter-spacing="0.8">
      2016 – 2026
    </text>
  </g>

  <!-- Typography / Key Visual Title Ribbons -->
  <!-- Top Badge -->
  <g transform="translate(600, 52)">
    <rect x="-225" y="-15" width="450" height="30" rx="15" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(96, 165, 250, 0.45)" stroke-width="1" filter="url(#softGlow)"/>
    <circle cx="-198" cy="0" r="3.5" fill="#38bdf8"/>
    <text x="0" y="4.5" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="800" font-size="11.5" fill="#e0f2fe" letter-spacing="2.2">
      3RD JAPAN–KOREA MENTAL FORUM 2026 · YOKOHAMA
    </text>
    <circle cx="198" cy="0" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- Main Theme: EVOLUTION TOGETHER -->
  <g transform="translate(600, 342)">
    <text x="0" y="0" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="44" fill="#0284c7" letter-spacing="5" opacity="0.65" filter="url(#highGlow)">
      EVOLUTION TOGETHER
    </text>
    <text x="0" y="0" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="5">
      EVOLUTION TOGETHER
    </text>
    
    <!-- Sub-label in Korean and Japanese -->
    <text x="0" y="27" text-anchor="middle" font-family="'Pretendard', 'Noto Sans JP', sans-serif" font-weight="700" font-size="13.5" fill="#38bdf8" letter-spacing="1.8">
      함께하는 진화, 인간의 무한한 가능성을 깨우다 · 共に進化し、可能性を拓く
    </text>

    <!-- Venue & Date Footer Banner -->
    <g transform="translate(0, 56)">
      <rect x="-240" y="-13" width="480" height="26" rx="5" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="0.8"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Pretendard', 'Montserrat', sans-serif" font-weight="600" font-size="10.5" fill="#cbd5e1" letter-spacing="0.8">
        📍 関東学院大学 横浜関内校舎 17F  |  🗓 2026. 10. 03 (SAT)
      </text>
    </g>
  </g>

  <!-- Ambient Light Sparks Floating Upwards -->
  <g fill="#ffffff" opacity="0.8" filter="url(#softGlow)">
    <circle cx="480" cy="170" r="2"/>
    <circle cx="530" cy="140" r="1.5"/>
    <circle cx="680" cy="150" r="2"/>
    <circle cx="730" cy="180" r="2.5" fill="#fde047"/>
    <circle cx="580" cy="280" r="1.8" fill="#38bdf8"/>
    <circle cx="640" cy="290" r="2.2" fill="#f59e0b"/>
    <circle cx="410" cy="230" r="1.5"/>
    <circle cx="790" cy="240" r="1.8"/>
  </g>
</svg>
