<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="40%" stop-color="#0b1528"/>
      <stop offset="70%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>

    <radialGradient id="koreaGlow" cx="25%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="japanGlow" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="blueStream" x1="0%" y1="100%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="goldStream" x1="100%" y1="100%" x2="20%" y2="20%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="goldEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="skylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a101d" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="highGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#koreaGlow)"/>
  <rect width="1200" height="675" fill="url(#japanGlow)"/>

  <!-- Subtle Perspective Grid / Horizon -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="0.8">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="565" x2="1200" y2="565"/>
    <line x1="0" y1="595" x2="1200" y2="595"/>
    <line x1="0" y1="632" x2="1200" y2="632"/>
    <line x1="600" y1="510" x2="0" y2="675"/>
    <line x1="600" y1="510" x2="200" y2="675"/>
    <line x1="600" y1="510" x2="400" y2="675"/>
    <line x1="600" y1="510" x2="600" y2="675"/>
    <line x1="600" y1="510" x2="800" y2="675"/>
    <line x1="600" y1="510" x2="1000" y2="675"/>
    <line x1="600" y1="510" x2="1200" y2="675"/>
  </g>

  <!-- Yokohama Kannai Skyline Silhouette (Waterfront) -->
  <g opacity="0.45" fill="url(#skylineGrad)">
    <!-- Distant hills/islands -->
    <path d="M0 520 Q200 500 450 515 Q750 495 1050 518 L1200 520 L1200 675 L0 675 Z"/>
    
    <!-- Yokohama Landmark Tower Silhouette & High-rises (Left-Center) -->
    <rect x="220" y="380" width="48" height="140" rx="3"/>
    <polygon points="220,380 244,310 268,380"/>
    <rect x="275" y="420" width="38" height="100" rx="2"/>
    <rect x="320" y="445" width="55" height="75" rx="2"/>
    <rect x="170" y="450" width="42" height="70" rx="2"/>
    <rect x="120" y="465" width="45" height="55" rx="2"/>

    <!-- Ferris Wheel Silhouette (Cosmo Clock 21) -->
    <circle cx="395" cy="455" r="32" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="395" y1="455" x2="395" y2="520" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

    <!-- Yokohama Bay Bridge (Right Side) -->
    <!-- Tower 1 -->
    <polygon points="860,520 864,360 872,360 876,520"/>
    <!-- Tower 2 -->
    <polygon points="980,520 984,360 992,360 996,520"/>
    <!-- Main deck -->
    <rect x="800" y="460" width="260" height="8" rx="2"/>
    <!-- Suspension cables -->
    <line x1="868" y1="365" x2="800" y2="460" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="868" y1="365" x2="830" y2="460" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
    <line x1="868" y1="365" x2="924" y2="460" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="988" y1="365" x2="924" y2="460" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="988" y1="365" x2="1030" y2="460" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
    <line x1="988" y1="365" x2="1060" y2="460" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Water Surface Reflections -->
  <rect x="0" y="520" width="1200" height="155" fill="#060c17" opacity="0.75"/>
  <ellipse cx="600" cy="545" rx="550" ry="12" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="570" rx="420" ry="8" fill="#fbbf24" opacity="0.1" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="610" rx="300" ry="6" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Neural Synapse Network / Mental Coaching Graph (Constellations) -->
  <g stroke="#93c5fd" stroke-width="1" opacity="0.32" filter="url(#softGlow)">
    <line x1="140" y1="180" x2="260" y2="130"/>
    <line x1="260" y1="130" x2="380" y2="200"/>
    <line x1="380" y1="200" x2="490" y2="140"/>
    <line x1="490" y1="140" x2="600" y2="220"/>
    
    <line x1="1060" y1="170" x2="940" y2="120"/>
    <line x1="940" y1="120" x2="820" y2="190"/>
    <line x1="820" y1="190" x2="710" y2="140"/>
    <line x1="710" y1="140" x2="600" y2="220"/>

    <line x1="260" y1="130" x2="220" y2="260"/>
    <line x1="380" y1="200" x2="340" y2="310"/>
    <line x1="940" y1="120" x2="980" y2="250"/>
    <line x1="820" y1="190" x2="860" y2="300"/>

    <line x1="490" y1="140" x2="600" y2="310"/>
    <line x1="710" y1="140" x2="600" y2="310"/>
  </g>

  <!-- Glowing Nodes of the Neural Network -->
  <g fill="#60a5fa" filter="url(#softGlow)">
    <circle cx="140" cy="180" r="4"/>
    <circle cx="260" cy="130" r="5" fill="#38bdf8"/>
    <circle cx="380" cy="200" r="6" fill="#93c5fd"/>
    <circle cx="490" cy="140" r="5.5" fill="#60a5fa"/>
    <circle cx="220" cy="260" r="3.5"/>
    <circle cx="340" cy="310" r="4"/>
  </g>
  <g fill="#fbbf24" filter="url(#softGlow)">
    <circle cx="1060" cy="170" r="4"/>
    <circle cx="940" cy="120" r="5" fill="#fde047"/>
    <circle cx="820" cy="190" r="6" fill="#f59e0b"/>
    <circle cx="710" cy="140" r="5.5" fill="#fbbf24"/>
    <circle cx="980" cy="250" r="3.5"/>
    <circle cx="860" cy="300" r="4"/>
  </g>

  <!-- Dual Energy Streams / "Evolution Together" Convergence Ribbons -->
  <!-- Korea Stream (Cobalt Blue -> Cyan, ascending from bottom-left) -->
  <path d="M-60 620 C 180 580, 240 380, 440 340 C 540 320, 580 300, 600 290" 
        fill="none" stroke="url(#blueStream)" stroke-width="18" stroke-linecap="round" opacity="0.85" filter="url(#highGlow)"/>
  <path d="M-60 620 C 180 580, 240 380, 440 340 C 540 320, 580 300, 600 290" 
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M-20 650 C 220 590, 310 440, 480 380 C 550 350, 580 320, 600 310" 
        fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Japan Stream (Amber Gold -> Yellow, ascending from bottom-right) -->
  <path d="M1260 620 C 1020 580, 960 380, 760 340 C 660 320, 620 300, 600 290" 
        fill="none" stroke="url(#goldStream)" stroke-width="18" stroke-linecap="round" opacity="0.85" filter="url(#highGlow)"/>
  <path d="M1260 620 C 1020 580, 960 380, 760 340 C 660 320, 620 300, 600 290" 
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M1220 650 C 980 590, 890 440, 720 380 C 650 350, 620 320, 600 310" 
        fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Center Convergence Burst (Core Illuminator) -->
  <circle cx="600" cy="290" r="160" fill="url(#coreGlow)"/>
  <ellipse cx="600" cy="290" rx="90" ry="24" fill="#ffffff" opacity="0.75" filter="url(#highGlow)"/>
  
  <!-- Four-Point Stellar Flare -->
  <g transform="translate(600, 290)" filter="url(#highGlow)">
    <polygon points="0,-110 5,-20 90,0 5,20 0,110 -5,20 -90,0 -5,-20" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-60 3,-10 50,0 3,10 0,60 -3,10 -50,0 -3,-10" fill="#fde047" opacity="0.85"/>
  </g>

  <!-- 10th Anniversary Grand Center Emblem -->
  <g transform="translate(600, 290)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#goldEmblem)" stroke-width="2" opacity="0.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="102" fill="#070d1a" stroke="url(#goldEmblem)" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="94" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

    <!-- Dual National Flag Accent Dots (Korea Blue / Japan Red/Gold) -->
    <g transform="translate(0, -68)">
      <circle cx="-16" cy="0" r="6" fill="#2563eb" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
      <circle cx="16" cy="0" r="6" fill="#e11d48" filter="url(#softGlow)"/>
    </g>

    <!-- Number "10" -->
    <text x="0" y="-8" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="52" fill="url(#goldEmblem)" letter-spacing="1">
      10<tspan font-size="26" font-weight="800" dy="-20">th</tspan>
    </text>

    <!-- Subtitle: ANNIVERSARY -->
    <text x="0" y="24" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="800" font-size="11.5" fill="#fef08a" letter-spacing="4">
      ANNIVERSARY
    </text>

    <!-- Partnership: MCCI & FIELD FLOW -->
    <text x="0" y="44" text-anchor="middle" font-family="'Pretendard', 'Inter', sans-serif" font-weight="700" font-size="9.5" fill="#94a3b8" letter-spacing="1.5">
      MCCI × FIELD FLOW
    </text>

    <!-- Milestone Era: 2016 – 2026 -->
    <rect x="-38" y="55" width="76" height="16" rx="8" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="0" y="66.5" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9" fill="#fbbf24" letter-spacing="1">
      2016 – 2026
    </text>
  </g>

  <!-- Typography / Key Visual Title Ribbons -->
  <!-- Top Badge: 3rd Japan-Korea International Mental Coaching Forum 2026 -->
  <g transform="translate(600, 78)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(96, 165, 250, 0.45)" stroke-width="1" filter="url(#softGlow)"/>
    <circle cx="-212" cy="0" r="4" fill="#38bdf8"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="800" font-size="13" fill="#e0f2fe" letter-spacing="2.5">
      3RD JAPAN–KOREA MENTAL FORUM 2026 · YOKOHAMA
    </text>
    <circle cx="212" cy="0" r="4" fill="#f59e0b"/>
  </g>

  <!-- Main Theme: EVOLUTION TOGETHER -->
  <g transform="translate(600, 460)">
    <!-- Backing Glow for Main Title -->
    <text x="0" y="0" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="52" fill="#0284c7" letter-spacing="6" opacity="0.6" filter="url(#highGlow)">
      EVOLUTION TOGETHER
    </text>
    <text x="0" y="0" text-anchor="middle" font-family="'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="6">
      EVOLUTION TOGETHER
    </text>
    
    <!-- Sub-label in Korean and Japanese -->
    <text x="0" y="32" text-anchor="middle" font-family="'Pretendard', 'Noto Sans JP', sans-serif" font-weight="700" font-size="16" fill="#38bdf8" letter-spacing="2">
      함께하는 진화, 인간의 무한한 가능성을 깨우다 · 共に進化し、可能性を拓く
    </text>

    <!-- Venue & Date Footer Banner -->
    <g transform="translate(0, 68)">
      <rect x="-260" y="-15" width="520" height="30" rx="6" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Pretendard', 'Montserrat', sans-serif" font-weight="600" font-size="12" fill="#cbd5e1" letter-spacing="1">
        📍 関東学院大学 横浜関内校舎 17F &nbsp;|&nbsp; 🗓 2026. 10. 03 (SAT)
      </text>
    </g>
  </g>

  <!-- Ambient Light Sparks / Embers Floating Upwards -->
  <g fill="#ffffff" opacity="0.8" filter="url(#softGlow)">
    <circle cx="480" cy="240" r="2.5"/>
    <circle cx="530" cy="200" r="1.5"/>
    <circle cx="680" cy="220" r="2"/>
    <circle cx="730" cy="260" r="3" fill="#fde047"/>
    <circle cx="580" cy="380" r="2" fill="#38bdf8"/>
    <circle cx="640" cy="390" r="2.5" fill="#f59e0b"/>
    <circle cx="410" cy="320" r="1.5"/>
    <circle cx="790" cy="330" r="2"/>
    <circle cx="510" cy="420" r="1.5"/>
    <circle cx="690" cy="430" r="1.5"/>
  </g>
</svg>
